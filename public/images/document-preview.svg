<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="doc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="highlight-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.15)" />
      <stop offset="100%" stop-color="rgba(59,130,246,0.25)" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="480" height="240" rx="16" fill="url(#doc-bg)" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Document Sheet Graphic -->
  <g transform="translate(25, 20)">
    <rect width="170" height="200" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.05))" />
    <!-- Header banner on doc -->
    <rect x="15" y="15" width="140" height="12" rx="3" fill="#eff6ff" />
    <text x="22" y="24" font-family="Inter, sans-serif" font-size="7" font-weight="700" fill="#1d4ed8">TENDER SPECIFICATION #2026-09</text>
    
    <!-- Text line placeholders -->
    <rect x="15" y="36" width="130" height="6" rx="2" fill="#cbd5e1" />
    <rect x="15" y="48" width="110" height="6" rx="2" fill="#e2e8f0" />
    
    <!-- Highlighted Clause 1: AI Match -->
    <rect x="12" y="60" width="146" height="32" rx="4" fill="url(#highlight-blue)" stroke="#93c5fd" stroke-width="1" />
    <rect x="18" y="66" width="90" height="6" rx="2" fill="#2563eb" />
    <rect x="18" y="78" width="130" height="5" rx="2" fill="#64748b" />

    <!-- More lines -->
    <rect x="15" y="100" width="140" height="6" rx="2" fill="#cbd5e1" />
    <rect x="15" y="112" width="95" height="6" rx="2" fill="#e2e8f0" />

    <!-- Highlighted Clause 2: Gap Detected -->
    <rect x="12" y="126" width="146" height="30" rx="4" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
    <rect x="18" y="132" width="70" height="6" rx="2" fill="#b45309" />
    <rect x="18" y="143" width="120" height="5" rx="2" fill="#d97706" />

    <rect x="15" y="166" width="125" height="6" rx="2" fill="#cbd5e1" />
    <rect x="15" y="178" width="80" height="6" rx="2" fill="#e2e8f0" />

    <!-- Scan Line Effect -->
    <line x1="10" y1="75" x2="160" y2="75" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 2" />
  </g>

  <!-- Right Side: AI Extraction Badges & Visual Flow -->
  <g transform="translate(220, 30)">
    <!-- Badge 1: Document Uploaded & Parsed -->
    <g transform="translate(0, 0)">
      <rect width="230" height="50" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
      <circle cx="24" cy="25" r="12" fill="#eff6ff" />
      <path d="M 24 19 V 29 M 20 23 L 24 19 L 28 23" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round" />
      <text x="46" y="21" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Document Extraction</text>
      <text x="46" y="35" font-family="Inter, sans-serif" font-size="8" font-weight="500" fill="#64748b">OCR &amp; Clause Segmentation</text>
      <rect x="180" y="15" width="40" height="20" rx="10" fill="#d1fae5" />
      <text x="200" y="28" font-family="Inter, sans-serif" font-size="7.5" font-weight="700" fill="#047857" text-anchor="middle">✓ Ready</text>
    </g>

    <!-- Arrow down -->
    <path d="M 115 52 V 63" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Badge 2: Requirement Matching -->
    <g transform="translate(0, 65)">
      <rect width="230" height="50" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1" />
      <circle cx="24" cy="25" r="12" fill="#f3e8ff" />
      <path d="M 18 20 H 30 M 18 25 H 30 M 18 30 H 26" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" />
      <text x="46" y="21" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">BIS Standards Mapping</text>
      <text x="46" y="35" font-family="Inter, sans-serif" font-size="8" font-weight="500" fill="#64748b">Matching IS 10322 &amp; IS 16107</text>
      <rect x="180" y="15" width="40" height="20" rx="10" fill="#dbeafe" />
      <text x="200" y="28" font-family="Inter, sans-serif" font-size="7.5" font-weight="700" fill="#1e40af" text-anchor="middle">4 Matches</text>
    </g>

    <!-- Arrow down -->
    <path d="M 115 117 V 128" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Badge 3: Gap & Version Audit -->
    <g transform="translate(0, 130)">
      <rect width="230" height="50" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1" />
      <circle cx="24" cy="25" r="12" fill="#fef3c7" />
      <path d="M 24 19 V 26 M 24 29 V 30" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
      <text x="46" y="21" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a">Gap &amp; Version Audit</text>
      <text x="46" y="35" font-family="Inter, sans-serif" font-size="8" font-weight="500" fill="#64748b">1 Outdated Ref &amp; 1 Missing Cert</text>
      <rect x="180" y="15" width="40" height="20" rx="10" fill="#fef3c7" />
      <text x="200" y="28" font-family="Inter, sans-serif" font-size="7.5" font-weight="700" fill="#b45309" text-anchor="middle">2 Gaps</text>
    </g>
  </g>
</svg>
